<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Orion Extension Studio</title>
  <style>
    :root {
      --bg: #121214;
      --surface: #1e1e24;
      --border: #2e2e38;
      --text: #f4f4f6;
      --muted: #9ca3af;
      --accent: #6366f1;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
    header {
      background: var(--surface);
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: space-between;
    }
    header input[type="text"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 14px;
      min-width: 110px;
      flex: 1;
      max-width: 160px;
    }
    button {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      user-select: none;
      -webkit-user-select: none;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.4; pointer-events: none; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.danger { color: var(--danger); border-color: rgba(239, 68, 68, 0.3); }

    .file-bar {
      display: flex;
      overflow-x: auto;
      background: #16161a;
      border-bottom: 1px solid var(--border);
      padding: 8px;
      gap: 8px;
      scrollbar-width: none;
    }
    .file-bar::-webkit-scrollbar { display: none; }
    .file-tab {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 13px;
      flex-shrink: 0;
    }
    .file-tab.active {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.15);
    }
    .file-tab input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      margin: 0;
    }
    .file-tab span { cursor: pointer; }

    .toolbar {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .toolbar::-webkit-scrollbar { display: none; }

    .editor-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    textarea {
      flex: 1;
      width: 100%;
      background: var(--bg);
      color: #e5e7eb;
      border: none;
      padding: 14px;
      font-family: "SF Mono", Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      outline: none;
      tab-size: 2;
    }
    .binary-notice {
      flex: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      padding: 24px;
      text-align: center;
      gap: 8px;
      font-size: 14px;
    }
    .binary-notice img {
      max-width: 96px;
      max-height: 96px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 6px;
    }

    .mobile-keys {
      display: flex;
      overflow-x: auto;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 6px;
      gap: 6px;
      scrollbar-width: none;
    }
    .mobile-keys::-webkit-scrollbar { display: none; }
    .mobile-keys button {
      padding: 8px 12px;
      font-family: monospace;
      font-size: 15px;
      background: var(--bg);
      min-width: 38px;
      justify-content: center;
    }

    #toast {
      position: fixed;
      bottom: 65px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--success);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 100;
    }
  </style>
</head>
<body>

<header>
  <input type="text" id="zipName" value="my-orion-ext" placeholder="Extension name" />
  <div style="display:flex; gap:6px;">
    <button onclick="triggerImport()">📂 Import</button>
    <button onclick="addNewFile()">+ File</button>
    <button class="primary" id="exportBtn" onclick="exportZip()">Export (3)</button>
  </div>
  <input type="file" id="fileImporter" accept=".zip,.json,.js,.css,.html,.txt,.svg,.png,.jpg,.jpeg,.webp" multiple style="display:none" />
</header>

<div class="file-bar" id="fileBar"></div>

<div class="toolbar">
  <button id="undoBtn" onclick="undoCode()">↩️ Undo</button>
  <button id="redoBtn" onclick="redoCode()">↪️ Redo</button>
  <button onclick="copyCode()">📋 Copy</button>
  <button onclick="pasteCode()">📥 Paste</button>
  <button onclick="clearCode()">🧹 Clear</button>
  <button onclick="renameCurrentFile()">✏️ Rename</button>
  <button class="danger" onclick="deleteCurrentFile()">🗑️ Delete</button>
</div>

<div class="editor-wrap">
  <textarea id="codeEditor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
  <div class="binary-notice" id="binaryNotice">
    <img id="binaryPreview" alt="" style="display:none" />
    <strong id="binaryTitle">Binary Asset</strong>
    <span>This binary file is stored intact and will be included when you export the ZIP.</span>
  </div>
</div>

<div class="mobile-keys">
  <button onclick="insertChar('  ', true)">Tab</button>
  <button onclick="insertChar('{', true)">{</button>
  <button onclick="insertChar('}', true)">}</button>
  <button onclick="insertChar('[', true)">[</button>
  <button onclick="insertChar(']', true)">]</button>
  <button onclick="insertChar('(', true)">(</button>
  <button onclick="insertChar(')', true)">)</button>
  <button onclick="insertChar('&quot;', true)">"</button>
  <button onclick="insertChar('\'', true)">'</button>
  <button onclick="insertChar(';', true)">;</button>
  <button onclick="insertChar(':', true)">:</button>
  <button onclick="insertChar('=', true)">=</button>
  <button onclick="insertChar('/', true)">/</button>
</div>

<div id="toast">Done!</div>

<script>
  const STORAGE_KEY = 'orion_ext_studio_v4';

  const defaultFiles = [
    {
      id: 'f1',
      name: 'manifest.json',
      selected: true,
      isBinary: false,
      content: JSON.stringify({
        manifest_version: 3,
        name: "My Orion Extension",
        version: "1.0",
        description: "Custom extension built on iOS",
        content_scripts: [
          {
            matches: ["<all_urls>"],
            js: ["content.js"],
            css: ["styles.css"]
          }
        ]
      }, null, 2)
    },
    {
      id: 'f2',
      name: 'content.js',
      selected: true,
      isBinary: false,
      content: 'console.log("Orion extension loaded!");\n'
    },
    {
      id: 'f3',
      name: 'styles.css',
      selected: true,
      isBinary: false,
      content: '/* Custom styles */\nbody {\n  \n}\n'
    }
  ];

  let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
    zipName: 'my-orion-ext',
    activeId: 'f1',
    files: defaultFiles
  };

  const historyMap = {};
  let typingTimer = null;

  function ensureHistory(file) {
    if (!historyMap[file.id]) {
      historyMap[file.id] = { undo: [file.content], redo: [] };
    }
    return historyMap[file.id];
  }

  function pushSnapshot(file, newValue) {
    if (file.isBinary) return;
    const h = ensureHistory(file);
    if (h.undo[h.undo.length - 1] !== newValue) {
      h.undo.push(newValue);
      if (h.undo.length > 60) h.undo.shift();
      h.redo = [];
    }
    updateHistoryButtons();
  }

  const fileBar = document.getElementById('fileBar');
  const editor = document.getElementById('codeEditor');
  const binaryNotice = document.getElementById('binaryNotice');
  const binaryPreview = document.getElementById('binaryPreview');
  const binaryTitle = document.getElementById('binaryTitle');
  const zipInput = document.getElementById('zipName');
  const exportBtn = document.getElementById('exportBtn');
  const undoBtn = document.getElementById('undoBtn');
  const redoBtn = document.getElementById('redoBtn');
  const fileImporter = document.getElementById('fileImporter');

  zipInput.value = state.zipName;
  zipInput.addEventListener('input', () => {
    state.zipName = zipInput.value;
    saveState();
  });

  editor.addEventListener('input', () => {
    const file = getActiveFile();
    if (!file || file.isBinary) return;
    file.content = editor.value;
    saveState();

    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => {
      pushSnapshot(file, editor.value);
    }, 350);
  });

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      showToast('Storage full - export ZIP to save');
    }
  }

  function getActiveFile() {
    return state.files.find(f => f.id === state.activeId) || state.files[0];
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.opacity = '1';
    setTimeout(() => t.style.opacity = '0', 2000);
  }

  function updateExportCount() {
    const count = state.files.filter(f => f.selected).length;
    exportBtn.textContent = `Export (${count})`;
  }

  function updateHistoryButtons() {
    const file = getActiveFile();
    if (!file || file.isBinary) {
      undoBtn.disabled = true;
      redoBtn.disabled = true;
      return;
    }
    const h = ensureHistory(file);
    undoBtn.disabled = h.undo.length <= 1;
    redoBtn.disabled = h.redo.length === 0;
  }

  function undoCode() {
    const file = getActiveFile();
    if (!file || file.isBinary) return;
    const h = ensureHistory(file);
    if (h.undo.length > 1) {
      const current = h.undo.pop();
      h.redo.push(current);
      const prev = h.undo[h.undo.length - 1];
      file.content = prev;
      editor.value = prev;
      saveState();
      updateHistoryButtons();
    }
  }

  function redoCode() {
    const file = getActiveFile();
    if (!file || file.isBinary) return;
    const h = ensureHistory(file);
    if (h.redo.length > 0) {
      const next = h.redo.pop();
      h.undo.push(next);
      file.content = next;
      editor.value = next;
      saveState();
      updateHistoryButtons();
    }
  }

  function render() {
    fileBar.innerHTML = '';
    const active = getActiveFile();
    if (active) {
      state.activeId = active.id;
      ensureHistory(active);
    }

    state.files.forEach(file => {
      const tab = document.createElement('div');
      tab.className = 'file-tab' + (file.id === state.activeId ? ' active' : '');

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = file.selected;
      cb.onchange = (e) => {
        file.selected = e.target.checked;
        saveState();
        updateExportCount();
      };

      const label = document.createElement('span');
      label.textContent = file.name;
      label.onclick = () => {
        state.activeId = file.id;
        saveState();
        render();
      };

      tab.appendChild(cb);
      tab.appendChild(label);
      fileBar.appendChild(tab);
    });

    if (active && active.isBinary) {
      editor.style.display = 'none';
      binaryNotice.style.display = 'flex';
      binaryTitle.textContent = active.name;
      if (/\.(png|jpg|jpeg|gif|webp|svg)$/i.test(active.name)) {
        const mime = active.name.endsWith('.svg') ? 'image/svg+xml' : 'image/png';
        binaryPreview.src = `data:${mime};base64,${active.content}`;
        binaryPreview.style.display = 'block';
      } else {
        binaryPreview.style.display = 'none';
      }
    } else {
      binaryNotice.style.display = 'none';
      editor.style.display = 'block';
      editor.value = active ? active.content : '';
    }

    updateExportCount();
    updateHistoryButtons();
  }

  function addNewFile() {
    const name = prompt('Enter file name (e.g., popup.html, background.js):');
    if (!name || !name.trim()) return;
    const newFile = {
      id: 'f_' + Date.now(),
      name: name.trim(),
      selected: true,
      isBinary: false,
      content: ''
    };
    state.files.push(newFile);
    state.activeId = newFile.id;
    saveState();
    render();
  }

  function renameCurrentFile() {
    const file = getActiveFile();
    if (!file) return;
    const newName = prompt('Rename file:', file.name);
    if (newName && newName.trim()) {
      file.name = newName.trim();
      saveState();
      render();
    }
  }

  function deleteCurrentFile() {
    if (state.files.length <= 1) {
      alert('You must keep at least one file.');
      return;
    }
    const file = getActiveFile();
    if (confirm(`Delete ${file.name}?`)) {
      state.files = state.files.filter(f => f.id !== file.id);
      state.activeId = state.files[0].id;
      saveState();
      render();
    }
  }

  async function copyCode() {
    const file = getActiveFile();
    if (!file || file.isBinary) return;
    try {
      await navigator.clipboard.writeText(editor.value);
      showToast('Copied to clipboard');
    } catch {
      const wasFocused = document.activeElement === editor;
      editor.select();
      document.execCommand('copy');
      if (!wasFocused) editor.blur();
      showToast('Copied!');
    }
  }

  async function pasteCode() {
    const file = getActiveFile();
    if (!file || file.isBinary) return;
    try {
      const text = await navigator.clipboard.readText();
      if (document.activeElement === editor) editor.blur();
      insertChar(text, false);
      showToast('Pasted from clipboard');
    } catch {
      alert('iOS blocked automatic paste. Tap inside the editor and select "Paste".');
    }
  }

  function clearCode() {
    const file = getActiveFile();
    if (!file || file.isBinary) return;
    pushSnapshot(file, editor.value);
    editor.value = '';
    file.content = '';
    pushSnapshot(file, '');
    saveState();
    showToast('Cleared');
  }

  function insertChar(str, keepFocus = false) {
    const file = getActiveFile();
    if (!file || file.isBinary) return;
    pushSnapshot(file, editor.value);

    const start = editor.selectionStart ?? editor.value.length;
    const end = editor.selectionEnd ?? editor.value.length;
    editor.value = editor.value.substring(0, start) + str + editor.value.substring(end);
    editor.selectionStart = editor.selectionEnd = start + str.length;

    if (keepFocus) {
      editor.focus();
    } else if (document.activeElement === editor) {
      editor.blur();
    }

    file.content = editor.value;
    pushSnapshot(file, editor.value);
    saveState();
  }

  // --- IMPORT ZIP OR FILES ---
  function triggerImport() {
    fileImporter.value = '';
    fileImporter.click();
  }

  fileImporter.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;

    try {
      if (files.length === 1 && files[0].name.toLowerCase().endsWith('.zip')) {
        await importZipArchive(files[0]);
      } else {
        await importLooseFiles(files);
      }
    } catch (err) {
      alert('Import error: ' + err.message);
    }
  });

  function isTextFilename(name) {
    return /\.(json|js|mjs|cjs|ts|css|html|htm|txt|md|svg|xml|yaml|yml)$/i.test(name);
  }

  function uint8ToBase64(bytes) {
    let bin = '';
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(bin);
  }

  function base64ToUint8(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  async function importLooseFiles(fileList) {
    const decoder = new TextDecoder();
    for (const f of fileList) {
      const buf = new Uint8Array(await f.arrayBuffer());
      const isText = isTextFilename(f.name);
      const content = isText ? decoder.decode(buf) : uint8ToBase64(buf);

      const existing = state.files.find(x => x.name === f.name);
      if (existing) {
        existing.content = content;
        existing.isBinary = !isText;
        existing.selected = true;
        historyMap[existing.id] = { undo: [content], redo: [] };
        state.activeId = existing.id;
      } else {
        const newFile = {
          id: 'f_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          name: f.name,
          selected: true,
          isBinary: !isText,
          content
        };
        state.files.push(newFile);
        state.activeId = newFile.id;
      }
    }
    saveState();
    render();
    showToast(`Imported ${fileList.length} file(s)`);
  }

  async function inflateRaw(compressedBytes) {
    if (typeof DecompressionStream === 'undefined') {
      throw new Error('This browser does not support Deflate decompression.');
    }
    const ds = new DecompressionStream('deflate-raw');
    const writer = ds.writable.getWriter();
    writer.write(compressedBytes);
    writer.close();
    const res = await new Response(ds.readable).arrayBuffer();
    return new Uint8Array(res);
  }

  async function importZipArchive(zipFile) {
    const buf = await zipFile.arrayBuffer();
    const bytes = new Uint8Array(buf);
    const view = new DataView(buf);
    const decoder = new TextDecoder();

    // Locate End of Central Directory (EOCD)
    let eocdOffset = -1;
    for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
      if (view.getUint32(i, true) === 0x06054b50) {
        eocdOffset = i;
        break;
      }
    }
    if (eocdOffset === -1) throw new Error('Invalid or corrupted ZIP file.');

    const totalEntries = view.getUint16(eocdOffset + 10, true);
    let cdOffset = view.getUint32(eocdOffset + 16, true);
    const extracted = [];

    for (let i = 0; i < totalEntries; i++) {
      if (view.getUint32(cdOffset, true) !== 0x02014b50) break;
      const method = view.getUint16(cdOffset + 10, true);
      const compSize = view.getUint32(cdOffset + 20, true);
      const nameLen = view.getUint16(cdOffset + 28, true);
      const extraLen = view.getUint16(cdOffset + 30, true);
      const commentLen = view.getUint16(cdOffset + 32, true);
      const localOffset = view.getUint32(cdOffset + 42, true);

      const rawName = decoder.decode(bytes.subarray(cdOffset + 46, cdOffset + 46 + nameLen));
      cdOffset += 46 + nameLen + extraLen + commentLen;

      // Skip directories and macOS metadata files
      if (rawName.endsWith('/') || rawName.startsWith('__MACOSX/') || rawName.endsWith('.DS_Store')) {
        continue;
      }

      const localNameLen = view.getUint16(localOffset + 26, true);
      const localExtraLen = view.getUint16(localOffset + 28, true);
      const dataStart = localOffset + 30 + localNameLen + localExtraLen;
      const compData = bytes.subarray(dataStart, dataStart + compSize);

      let fileBytes;
      if (method === 0) {
        fileBytes = compData;
      } else if (method === 8) {
        fileBytes = await inflateRaw(compData);
      } else {
        throw new Error(`Unsupported ZIP compression method (${method}) for ${rawName}`);
      }

      const isText = isTextFilename(rawName);
      extracted.push({
        id: 'f_' + Date.now() + '_' + i,
        name: rawName,
        selected: true,
        isBinary: !isText,
        content: isText ? decoder.decode(fileBytes) : uint8ToBase64(fileBytes)
      });
    }

    if (!extracted.length) throw new Error('No usable files found inside the ZIP.');

    // Strip single top-level wrapper folder if all files share one
    const firstSlash = extracted[0].name.indexOf('/');
    if (firstSlash > 0) {
      const prefix = extracted[0].name.slice(0, firstSlash + 1);
      if (extracted.every(f => f.name.startsWith(prefix))) {
        extracted.forEach(f => { f.name = f.name.slice(prefix.length); });
      }
    }

    const replace = confirm(
      `Found ${extracted.length} files in ${zipFile.name}.\n\nOK = Replace current project\nCancel = Merge into current project`
    );

    if (replace) {
      state.files = extracted;
      state.zipName = zipFile.name.replace(/\.zip$/i, '');
      zipInput.value = state.zipName;
      const manifest = extracted.find(f => f.name.toLowerCase() === 'manifest.json');
      state.activeId = manifest ? manifest.id : extracted[0].id;
    } else {
      for (const item of extracted) {
        const existing = state.files.find(x => x.name === item.name);
        if (existing) {
          existing.content = item.content;
          existing.isBinary = item.isBinary;
          existing.selected = true;
        } else {
          state.files.push(item);
        }
      }
    }

    Object.keys(historyMap).forEach(k => delete historyMap[k]);
    saveState();
    render();
    showToast(`Loaded ${extracted.length} files from ZIP`);
  }

  // --- BUILT-IN ZIP EXPORTER ---
  const crcTable = (() => {
    const table = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      table[i] = c;
    }
    return table;
  })();

  function crc32(bytes) {
    let crc = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) {
      crc = (crc >>> 8) ^ crcTable[(crc ^ bytes[i]) & 0xFF];
    }
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  function buildZipBlob(files) {
    const encoder = new TextEncoder();
    const localParts = [];
    const centralParts = [];
    let offset = 0;

    for (const file of files) {
      const nameBytes = encoder.encode(file.name);
      const dataBytes = file.isBinary ? base64ToUint8(file.content) : encoder.encode(file.content);
      const checksum = crc32(dataBytes);

      const localHeader = new Uint8Array(30 + nameBytes.length);
      const lv = new DataView(localHeader.buffer);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 0x0800, true);
      lv.setUint16(8, 0, true);
      lv.setUint16(10, 0, true);
      lv.setUint16(12, 0x0021, true);
      lv.setUint32(14, checksum, true);
      lv.setUint32(18, dataBytes.length, true);
      lv.setUint32(22, dataBytes.length, true);
      lv.setUint16(26, nameBytes.length, true);
      lv.setUint16(28, 0, true);
      localHeader.set(nameBytes, 30);

      const centralHeader = new Uint8Array(46 + nameBytes.length);
      const cv = new DataView(centralHeader.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, 0, true);
      cv.setUint16(14, 0x0021, true);
      cv.setUint32(16, checksum, true);
      cv.setUint32(20, dataBytes.length, true);
      cv.setUint32(24, dataBytes.length, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint16(30, 0, true);
      cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true);
      cv.setUint16(36, 0, true);
      cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);
      centralHeader.set(nameBytes, 46);

      localParts.push(localHeader, dataBytes);
      centralParts.push(centralHeader);
      offset += localHeader.length + dataBytes.length;
    }

    const centralSize = centralParts.reduce((acc, p) => acc + p.length, 0);
    const endRecord = new Uint8Array(22);
    const ev = new DataView(endRecord.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(4, 0, true);
    ev.setUint16(6, 0, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, centralSize, true);
    ev.setUint32(16, offset, true);
    ev.setUint16(20, 0, true);

    return new Blob([...localParts, ...centralParts, endRecord], { type: 'application/zip' });
  }

  function exportZip() {
    const selectedFiles = state.files.filter(f => f.selected);
    if (selectedFiles.length === 0) {
      alert('Check at least one file checkbox to include in the ZIP.');
      return;
    }

    const filename = (state.zipName.trim() || 'my-orion-ext') + '.zip';

    try {
      const blob = buildZipBlob(selectedFiles);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();

      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 2000);

      showToast(`Exported ${filename}`);
    } catch (err) {
      alert('Export error: ' + err.message);
    }
  }

  render();
</script>
</body>
</html>
