<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Orion Extension Studio</title>
  <style>
    :root {
      --bg: #121214;
      --surface: #1e1e24;
      --border: #2e2e38;
      --text: #f4f4f6;
      --accent: #6366f1;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
    header {
      background: var(--surface);
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }
    header input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 14px;
      width: 135px;
    }
    button {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      user-select: none;
      -webkit-user-select: none;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.4; pointer-events: none; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.danger { color: var(--danger); border-color: rgba(239, 68, 68, 0.3); }

    .file-bar {
      display: flex;
      overflow-x: auto;
      background: #16161a;
      border-bottom: 1px solid var(--border);
      padding: 8px;
      gap: 8px;
      scrollbar-width: none;
    }
    .file-bar::-webkit-scrollbar { display: none; }
    .file-tab {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 13px;
      flex-shrink: 0;
    }
    .file-tab.active {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.15);
    }
    .file-tab input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      margin: 0;
    }
    .file-tab span { cursor: pointer; }

    .toolbar {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .toolbar::-webkit-scrollbar { display: none; }

    .editor-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    textarea {
      flex: 1;
      width: 100%;
      background: var(--bg);
      color: #e5e7eb;
      border: none;
      padding: 14px;
      font-family: "SF Mono", Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      outline: none;
      tab-size: 2;
    }

    .mobile-keys {
      display: flex;
      overflow-x: auto;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 6px;
      gap: 6px;
      scrollbar-width: none;
    }
    .mobile-keys::-webkit-scrollbar { display: none; }
    .mobile-keys button {
      padding: 8px 12px;
      font-family: monospace;
      font-size: 15px;
      background: var(--bg);
      min-width: 38px;
      justify-content: center;
    }

    #toast {
      position: fixed;
      bottom: 65px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--success);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 100;
    }
  </style>
</head>
<body>

<header>
  <input type="text" id="zipName" value="my-orion-ext" placeholder="Extension name" />
  <div style="display:flex; gap:6px;">
    <button onclick="addNewFile()">+ File</button>
    <button class="primary" id="exportBtn" onclick="exportZip()">Export ZIP (3)</button>
  </div>
</header>

<div class="file-bar" id="fileBar"></div>

<div class="toolbar">
  <button id="undoBtn" onclick="undoCode()">↩️ Undo</button>
  <button id="redoBtn" onclick="redoCode()">↪️ Redo</button>
  <button onclick="copyCode()">📋 Copy</button>
  <button onclick="pasteCode()">📥 Paste</button>
  <button onclick="clearCode()">🧹 Clear</button>
  <button onclick="renameCurrentFile()">✏️ Rename</button>
  <button class="danger" onclick="deleteCurrentFile()">🗑️ Delete</button>
</div>

<div class="editor-wrap">
  <textarea id="codeEditor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
</div>

<div class="mobile-keys">
  <button onclick="insertChar('  ', true)">Tab</button>
  <button onclick="insertChar('{', true)">{</button>
  <button onclick="insertChar('}', true)">}</button>
  <button onclick="insertChar('[', true)">[</button>
  <button onclick="insertChar(']', true)">]</button>
  <button onclick="insertChar('(', true)">(</button>
  <button onclick="insertChar(')', true)">)</button>
  <button onclick="insertChar('&quot;', true)">"</button>
  <button onclick="insertChar('\'', true)">'</button>
  <button onclick="insertChar(';', true)">;</button>
  <button onclick="insertChar(':', true)">:</button>
  <button onclick="insertChar('=', true)">=</button>
  <button onclick="insertChar('/', true)">/</button>
</div>

<div id="toast">Done!</div>

<script>
  const STORAGE_KEY = 'orion_ext_studio_v3';

  const defaultFiles = [
    {
      id: 'f1',
      name: 'manifest.json',
      selected: true,
      content: JSON.stringify({
        manifest_version: 3,
        name: "My Orion Extension",
        version: "1.0",
        description: "Custom extension built on iOS",
        content_scripts: [
          {
            matches: ["<all_urls>"],
            js: ["content.js"],
            css: ["styles.css"]
          }
        ]
      }, null, 2)
    },
    {
      id: 'f2',
      name: 'content.js',
      selected: true,
      content: 'console.log("Orion extension loaded!");\n'
    },
    {
      id: 'f3',
      name: 'styles.css',
      selected: true,
      content: '/* Custom styles */\nbody {\n  \n}\n'
    }
  ];

  let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
    zipName: 'my-orion-ext',
    activeId: 'f1',
    files: defaultFiles
  };

  const historyMap = {};
  let typingTimer = null;

  function ensureHistory(file) {
    if (!historyMap[file.id]) {
      historyMap[file.id] = { undo: [file.content], redo: [] };
    }
    return historyMap[file.id];
  }

  function pushSnapshot(file, newValue) {
    const h = ensureHistory(file);
    if (h.undo[h.undo.length - 1] !== newValue) {
      h.undo.push(newValue);
      if (h.undo.length > 60) h.undo.shift();
      h.redo = [];
    }
    updateHistoryButtons();
  }

  const fileBar = document.getElementById('fileBar');
  const editor = document.getElementById('codeEditor');
  const zipInput = document.getElementById('zipName');
  const exportBtn = document.getElementById('exportBtn');
  const undoBtn = document.getElementById('undoBtn');
  const redoBtn = document.getElementById('redoBtn');

  zipInput.value = state.zipName;
  zipInput.addEventListener('input', () => {
    state.zipName = zipInput.value;
    saveState();
  });

  editor.addEventListener('input', () => {
    const file = getActiveFile();
    if (!file) return;
    file.content = editor.value;
    saveState();

    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => {
      pushSnapshot(file, editor.value);
    }, 350);
  });

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function getActiveFile() {
    return state.files.find(f => f.id === state.activeId) || state.files[0];
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.opacity = '1';
    setTimeout(() => t.style.opacity = '0', 1800);
  }

  function updateExportCount() {
    const count = state.files.filter(f => f.selected).length;
    exportBtn.textContent = `Export ZIP (${count})`;
  }

  function updateHistoryButtons() {
    const file = getActiveFile();
    if (!file) return;
    const h = ensureHistory(file);
    undoBtn.disabled = h.undo.length <= 1;
    redoBtn.disabled = h.redo.length === 0;
  }

  function undoCode() {
    const file = getActiveFile();
    if (!file) return;
    const h = ensureHistory(file);
    if (h.undo.length > 1) {
      const current = h.undo.pop();
      h.redo.push(current);
      const prev = h.undo[h.undo.length - 1];
      file.content = prev;
      editor.value = prev;
      saveState();
      updateHistoryButtons();
    }
  }

  function redoCode() {
    const file = getActiveFile();
    if (!file) return;
    const h = ensureHistory(file);
    if (h.redo.length > 0) {
      const next = h.redo.pop();
      h.undo.push(next);
      file.content = next;
      editor.value = next;
      saveState();
      updateHistoryButtons();
    }
  }

  function render() {
    fileBar.innerHTML = '';
    const active = getActiveFile();
    if (active) {
      state.activeId = active.id;
      ensureHistory(active);
    }

    state.files.forEach(file => {
      const tab = document.createElement('div');
      tab.className = 'file-tab' + (file.id === state.activeId ? ' active' : '');

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = file.selected;
      cb.onchange = (e) => {
        file.selected = e.target.checked;
        saveState();
        updateExportCount();
      };

      const label = document.createElement('span');
      label.textContent = file.name;
      label.onclick = () => {
        state.activeId = file.id;
        saveState();
        render();
      };

      tab.appendChild(cb);
      tab.appendChild(label);
      fileBar.appendChild(tab);
    });

    editor.value = active ? active.content : '';
    updateExportCount();
    updateHistoryButtons();
  }

  function addNewFile() {
    const name = prompt('Enter file name (e.g., popup.html, background.js):');
    if (!name || !name.trim()) return;
    const newFile = {
      id: 'f_' + Date.now(),
      name: name.trim(),
      selected: true,
      content: ''
    };
    state.files.push(newFile);
    state.activeId = newFile.id;
    saveState();
    render();
  }

  function renameCurrentFile() {
    const file = getActiveFile();
    if (!file) return;
    const newName = prompt('Rename file:', file.name);
    if (newName && newName.trim()) {
      file.name = newName.trim();
      saveState();
      render();
    }
  }

  function deleteCurrentFile() {
    if (state.files.length <= 1) {
      alert('You must keep at least one file.');
      return;
    }
    const file = getActiveFile();
    if (confirm(`Delete ${file.name}?`)) {
      state.files = state.files.filter(f => f.id !== file.id);
      state.activeId = state.files[0].id;
      saveState();
      render();
    }
  }

  async function copyCode() {
    try {
      await navigator.clipboard.writeText(editor.value);
      showToast('Copied to clipboard');
    } catch {
      const wasFocused = document.activeElement === editor;
      editor.select();
      document.execCommand('copy');
      if (!wasFocused) editor.blur();
      showToast('Copied!');
    }
  }

  async function pasteCode() {
    try {
      const text = await navigator.clipboard.readText();
      // Keep focus off the textarea so iOS keyboard stays closed
      if (document.activeElement === editor) editor.blur();
      insertChar(text, false);
      showToast('Pasted from clipboard');
    } catch {
      alert('iOS blocked automatic paste. Tap inside the editor and select "Paste".');
    }
  }

  function clearCode() {
    const file = getActiveFile();
    if (!file) return;
    pushSnapshot(file, editor.value);
    editor.value = '';
    file.content = '';
    pushSnapshot(file, '');
    saveState();
    showToast('Cleared');
  }

  function insertChar(str, keepFocus = false) {
    const file = getActiveFile();
    if (file) pushSnapshot(file, editor.value);

    const start = editor.selectionStart ?? editor.value.length;
    const end = editor.selectionEnd ?? editor.value.length;
    editor.value = editor.value.substring(0, start) + str + editor.value.substring(end);
    editor.selectionStart = editor.selectionEnd = start + str.length;

    if (keepFocus) {
      editor.focus();
    } else if (document.activeElement === editor) {
      editor.blur();
    }

    if (file) {
      file.content = editor.value;
      pushSnapshot(file, editor.value);
      saveState();
    }
  }

  // Built-in zero-dependency ZIP archive builder
  const crcTable = (() => {
    const table = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      table[i] = c;
    }
    return table;
  })();

  function crc32(bytes) {
    let crc = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) {
      crc = (crc >>> 8) ^ crcTable[(crc ^ bytes[i]) & 0xFF];
    }
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  function buildZipBlob(files) {
    const encoder = new TextEncoder();
    const localParts = [];
    const centralParts = [];
    let offset = 0;

    for (const file of files) {
      const nameBytes = encoder.encode(file.name);
      const dataBytes = encoder.encode(file.content);
      const checksum = crc32(dataBytes);

      const localHeader = new Uint8Array(30 + nameBytes.length);
      const lv = new DataView(localHeader.buffer);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 0x0800, true);
      lv.setUint16(8, 0, true);
      lv.setUint16(10, 0, true);
      lv.setUint16(12, 0x0021, true);
      lv.setUint32(14, checksum, true);
      lv.setUint32(18, dataBytes.length, true);
      lv.setUint32(22, dataBytes.length, true);
      lv.setUint16(26, nameBytes.length, true);
      lv.setUint16(28, 0, true);
      localHeader.set(nameBytes, 30);

      const centralHeader = new Uint8Array(46 + nameBytes.length);
      const cv = new DataView(centralHeader.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, 0, true);
      cv.setUint16(14, 0x0021, true);
      cv.setUint32(16, checksum, true);
      cv.setUint32(20, dataBytes.length, true);
      cv.setUint32(24, dataBytes.length, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint16(30, 0, true);
      cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true);
      cv.setUint16(36, 0, true);
      cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);
      centralHeader.set(nameBytes, 46);

      localParts.push(localHeader, dataBytes);
      centralParts.push(centralHeader);
      offset += localHeader.length + dataBytes.length;
    }

    const centralSize = centralParts.reduce((acc, p) => acc + p.length, 0);
    const endRecord = new Uint8Array(22);
    const ev = new DataView(endRecord.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(4, 0, true);
    ev.setUint16(6, 0, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, centralSize, true);
    ev.setUint32(16, offset, true);
    ev.setUint16(20, 0, true);

    return new Blob([...localParts, ...centralParts, endRecord], { type: 'application/zip' });
  }

  function exportZip() {
    const selectedFiles = state.files.filter(f => f.selected);
    if (selectedFiles.length === 0) {
      alert('Check at least one file checkbox to include in the ZIP.');
      return;
    }

    const filename = (state.zipName.trim() || 'my-orion-ext') + '.zip';

    try {
      const blob = buildZipBlob(selectedFiles);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();

      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 2000);

      showToast(`Exported ${filename}`);
    } catch (err) {
      alert('Export error: ' + err.message);
    }
  }

  render();
</script>
</body>
</html>
